worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Solo lectura: SRS permite DELETE /clients/<id> (expulsar al publicador).
        location ~ ^/api/srs/(.*)$ {
            limit_except GET { deny all; }
            proxy_pass http://SRS_PLACEHOLDER:1985/api/$1$is_args$args;
            add_header Access-Control-Allow-Origin *;
        }

        # Medidas y miniaturas que escribe el servicio probe.
        location /probe/ {
            alias /srv/probe/;
            add_header Cache-Control "no-store";
        }

        # HLS / HTTP-FLV por HTTPS (la URL HLS que muestra el dashboard).
        location /live/ {
            limit_except GET { deny all; }
            proxy_pass http://SRS_PLACEHOLDER:8080;
            proxy_buffering off;
            proxy_read_timeout 60s;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
