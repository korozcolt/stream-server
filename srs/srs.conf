listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;
srs_log_level       warn;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

srt_server {
    enabled         on;
    listen          10080;
}

vhost __defaultVhost__ {
    srt {
        enabled     on;
    }

    hls {
        enabled         on;
        hls_fragment    3;
        hls_window      12;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
