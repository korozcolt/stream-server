listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

# Logs detallados en consola
srs_log_level       trace;

# API HTTP de SRS, por si luego quieres monitorear
http_api {
    enabled         on;
    listen          1985;
}

# Servidor HTTP simple (no pasa por Traefik)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# 🔴 AQUÍ ES DONDE ACTIVAMOS SRT
srt_server {
    enabled         on;
    listen          10080;        # Puerto UDP que ya abriste en UFW
}

# Vhost por defecto (lo dejamos básico)
vhost __defaultVhost__ {

    # Habilita publicación (SRT → SRS)
    publish {
        enabled on;
    }

    # Habilita reproducción (si luego quieres enviar a OBS por RTMP)
    play {
        enabled on;
    }

    # Activa SRT en este vhost
    srt {
        enabled on;
    }
}

