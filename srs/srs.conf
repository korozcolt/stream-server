listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;
srs_log_level       info;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

srt_server {
    enabled         on;
    listen          10080;
    # 4K streams need a larger recovery buffer than the low-latency default,
    # especially over WAN/mobile links. Tune this to roughly 3x measured RTT.
    peerlatency     300;
    recvlatency     300;
    latency         300;
    tsbpdmode       on;
    tlpktdrop       on;
}

vhost __defaultVhost__ {
    srt {
        enabled     on;
    }

    play {
        # Avoid aggressive timestamp rewriting that drifts A/V apart.
        time_jitter     zero;
        # A/V sync: normalize timestamps and correct drift between audio and video.
        mix_correct     on;
    }

    hls {
        enabled         on;
        hls_fragment    3;
        hls_window      12;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
}
