services:
  srs:
    build: ./srs
    ports:
      - "1935:1935"         # RTMP publish/play
      - "10080:10080/udp"   # SRT publish/play
      - "8080:8080"         # HTTP: HLS, HTTP-FLV, stats
      - "1985:1985"         # HTTP API
    restart: always

  nginx-rtmp:
    build: ./nginx-rtmp
    ports:
      - "1936:1935"         # RTMP backup (port 1936 on host)
      - "8081:80"           # nginx-rtmp stats
    restart: always

  monitor:
    build: ./monitor
    restart: always
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.stream-monitor.rule=Host(`srt.kronnos.dev`)"
      - "traefik.http.routers.stream-monitor.entrypoints=websecure"
      - "traefik.http.routers.stream-monitor.tls.certresolver=letsencrypt"
      - "traefik.http.routers.stream-monitor.priority=100"
      - "traefik.http.services.stream-monitor.loadbalancer.server.port=80"

networks:
  dokploy-network:
    external: true
